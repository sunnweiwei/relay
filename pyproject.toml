[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay"
version = "0.1.0"
description = "OpenAI-compatible context-management proxy for append-only Responses loops"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "openai>=2.52.0",
  "starlette>=0.47.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
relay = "relay.proxy:main"

[project.optional-dependencies]
rlm = ["rlms==0.1.3"]

[tool.hatch.build.targets.wheel]
packages = ["relay"]
