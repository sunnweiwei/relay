[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay"
version = "0.1.0"
description = "Transparent context management between agent harnesses and model APIs"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "starlette>=0.47.0",
  "uvicorn>=0.35.0",
  "zstandard>=0.23",
]

[project.optional-dependencies]
experimental = ["openai>=2.52.0"]
rlm = ["openai>=2.52.0", "rlms==0.1.3"]
dev = ["openai>=2.52.0", "pytest>=8"]

[project.scripts]
relay = "relay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
